<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Revier Comic – Geschichten aus’m Ruhrpott - Archiv</title>

    <link rel="stylesheet" href="style.css">

    <style>
        #archiv {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .comic-card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.2s;
        }

        .comic-card:hover {
            transform: scale(1.03);
        }

        .comic-card img {
            width: 100%;
            display: block;
        }

        .comic-card h2,
        .comic-card p {
            padding: 10px;
            margin: 0;
        }

        .comic-card a {
            text-decoration: none;
            color: white;
        }

        @media (max-width: 900px) {
            #archiv {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            #archiv {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
      <div class="logo">Revier Comic</div>

      <nav>
        <a href="https://reviercomic.de/#comics">Comics</a>

		<a href="https://reviercomic.de/archiv.html">Archiv</a>

        
      </nav>
    </div>
  </header>
    <h1>Archiv</h1>

    <div id="archiv"></div>

    <script>

async function ladeArchiv() {

    const container = document.getElementById("archiv");

    try {

        const response = await fetch(
            "https://api.github.com/repos/pottgeschichten/pottgeschichten.github.io/contents/img/comic"
        );

        const daten = await response.json();

        daten
            .filter(datei => datei.name.endsWith(".png"))
            .sort((a, b) => {

                const zahlA = parseInt(a.name);
                const zahlB = parseInt(b.name);

                return zahlB - zahlA;

            })

            .forEach(datei => {

                const card = document.createElement("div");

                card.className = "comic-card";

                const nummer = datei.name.replace(".png", "");

                card.innerHTML = `
                    <img
                        src="${datei.download_url}"
                        alt="Comic ${nummer}"
                    >

                    <h2>
                        Comic ${nummer}
                    </h2>
                `;

                container.appendChild(card);

            });

    } catch (fehler) {

        container.innerHTML =
            "<p>Archiv konnte nicht geladen werden.</p>";

        console.error(fehler);

    }
}

ladeArchiv();

</script>

<script>
  function acceptCookies() {
    localStorage.setItem('pottgeschichten-cookies', 'accepted');
    document.getElementById('cookie-banner').style.display = 'none';
  }

  function declineCookies() {
    localStorage.setItem('pottgeschichten-cookies', 'declined');
    document.getElementById('cookie-banner').style.display = 'none';
  }

  window.addEventListener('load', function () {
    const cookieChoice = localStorage.getItem('pottgeschichten-cookies');

    if (cookieChoice) {
      document.getElementById('cookie-banner').style.display = 'none';
    }
  });
</script>
