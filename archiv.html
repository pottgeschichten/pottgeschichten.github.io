<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archiv - Reviercomic</title>

    <link rel="stylesheet" href="style.css">

    <style>
        #archiv {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .comic-card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.2s;
        }

        .comic-card:hover {
            transform: scale(1.03);
        }

        .comic-card img {
            width: 100%;
            display: block;
        }

        .comic-card h2,
        .comic-card p {
            padding: 10px;
            margin: 0;
        }

        .comic-card a {
            text-decoration: none;
            color: white;
        }

        @media (max-width: 900px) {
            #archiv {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            #archiv {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Archiv</h1>

    <div id="archiv"></div>

    <script>
        async function ladeArchiv() {

            const container = document.getElementById("archiv");

            try {

                const response = await fetch("archiv.json");
                const daten = await response.json();

                daten.forEach(eintrag => {

                    const card = document.createElement("div");
                    card.className = "comic-card";

                    card.innerHTML = `
                        <a href="${eintrag.link}">
                            <img src="${eintrag.bild}" alt="${eintrag.titel}">
                            <h2>${eintrag.titel}</h2>
                            <p>${eintrag.datum}</p>
                        </a>
                    `;

                    container.appendChild(card);

                });

            } catch (fehler) {

                container.innerHTML = "<p>Archiv konnte nicht geladen werden.</p>";
                console.error(fehler);

            }
        }

        ladeArchiv();
    </script>

</body>
</html>
